# Renn's builds: every push to renn-changes (or a run started by hand from the Actions tab) builds the
# Windows x64 installer and portable zip, nothing else, and publishes them as the latest release,
# tagged build-<UTC yyyymmddHHMM>. The installed app checks that release when it opens and offers
# to update itself (desktop/src/update.rs).
name: Windows build

on:
  push:
    branches: [renn-changes]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.0"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version and build number
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          echo "version=$listed" >>"$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d%H%M)" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-build-x64

      - name: Install WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >>"$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Package for Windows
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PROCRAFT_BUILD: ${{ steps.v.outputs.build }}
          PROCRAFT_UPDATE_REPO: ${{ github.repository }}
        run: ./packaging/windows/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: procraft-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          gh release create "build-$BUILD" dist/*.msi dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "ProCraft (Renn) build $BUILD" \
            --notes "Built from $GITHUB_SHA on renn-changes. The installed app offers this update when it opens."
